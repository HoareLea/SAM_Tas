name: Build (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Guard: if this workflow is ever merged upstream (e.g. HoareLea),
    # it will show as "skipped" and won't break their CI/branch protections.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    env:
      BUILD_CONFIG: Release
      # Reuse your existing secret name if you already use it elsewhere.
      # Falls back to GITHUB_TOKEN automatically.
      CHECKOUT_TOKEN: ${{ secrets.SUBMODULES_PAT || secrets.GITHUB_TOKEN }}

    steps:
      # -----------------------------------------------------------------------
      # CHECKOUT: put everything side-by-side (like your Azure "gitcache")
      # -----------------------------------------------------------------------
      - name: Checkout SAM_Tas (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: gitcache/SAM_Tas

      - name: Checkout dependency - SAM
        uses: actions/checkout@v4
        with:
          repository: SAM-BIM/SAM
          token: ${{ env.CHECKOUT_TOKEN }}
          fetch-depth: 0
          path: gitcache/SAM

      - name: Checkout dependency - SAM_SolarCalculator
        uses: actions/checkout@v4
        with:
          repository: SAM-BIM/SAM_SolarCalculator
          token: ${{ env.CHECKOUT_TOKEN }}
          fetch-depth: 0
          path: gitcache/SAM_SolarCalculator

      - name: Checkout dependency - SAM_Windows
        uses: actions/checkout@v4
        with:
          repository: SAM-BIM/SAM_Windows
          token: ${{ env.CHECKOUT_TOKEN }}
          fetch-depth: 0
          path: gitcache/SAM_Windows

      - name: Checkout dependency - SAM_gbXML
        uses: actions/checkout@v4
        with:
          repository: SAM-BIM/SAM_gbXML
          token: ${{ env.CHECKOUT_TOKEN }}
          fetch-depth: 0
          path: gitcache/SAM_gbXML

      # -----------------------------------------------------------------------
      # TOOLING
      # -----------------------------------------------------------------------
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet (matches old Azure pipeline)
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: "4.4.1"

      # Some SAM projects copy GH stuff into %APPDATA% during build
      - name: Create Grasshopper Libraries folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\Grasshopper\Libraries" | Out-Null

      # -----------------------------------------------------------------------
      # RESTORE (NuGet packages.config compatible)
      # -----------------------------------------------------------------------
      - name: NuGet restore (all solutions)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $solutions = Get-ChildItem -Path "gitcache" -Recurse -File -Filter *.sln | Select-Object -ExpandProperty FullName
          if (-not $solutions -or $solutions.Count -eq 0) {
            throw "No .sln files found under gitcache."
          }
          foreach ($s in $solutions) {
            Write-Host "nuget restore $s"
            nuget restore $s -Verbosity detailed
          }

      # -----------------------------------------------------------------------
      # BUILD in dependency order (SAM -> SolarCalculator -> Windows -> gbXML -> Tas)
      # -----------------------------------------------------------------------
      - name: Build (dependency chain)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          $ErrorActionPreference = 'Stop'

          function Find-BuildTarget([string]$repoRoot) {
            $buildAll = Join-Path $repoRoot 'BuildAll_Release_net.csproj'
            if (Test-Path $buildAll) { return $buildAll }

            $sln = Get-ChildItem -Path $repoRoot -Recurse -File -Filter *.sln -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sln) { return $sln.FullName }

            $csproj = Get-ChildItem -Path $repoRoot -Recurse -File -Filter *.csproj -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($csproj) { return $csproj.FullName }

            throw "No build target found in $repoRoot"
          }

          function Build-Repo([string]$repoName) {
            $root = Join-Path (Get-Location) ("gitcache\" + $repoName)
            if (-not (Test-Path $root)) { throw "Repo folder missing: $root" }

            $target = Find-BuildTarget $root
            Write-Host "------------------------------------------------------------"
            Write-Host "BUILD $repoName"
            Write-Host "Target: $target"
            Write-Host "------------------------------------------------------------"

            msbuild $target `
              /t:Rebuild `
              /m:1 /nr:false /v:m `
              /p:Configuration=$env:BUILD_CONFIG `
              /p:UseSharedCompilation=false
          }

          Build-Repo "SAM"
          Build-Repo "SAM_SolarCalculator"
          Build-Repo "SAM_Windows"
          Build-Repo "SAM_gbXML"
          Build-Repo "SAM_Tas"
