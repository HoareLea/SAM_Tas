name: Build (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    # Guard: if this workflow is ever merged upstream (e.g. HoareLea),
    # it will show as "skipped" and won't break their CI/branch protections.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    steps:
      # Clone repos as siblings (matches HintPath patterns like ..\..\..\SAM\build)
      - name: Checkout SAM_Tas (this repo)
        uses: actions/checkout@v4
        with:
          path: SAM_Tas
          fetch-depth: 0

      - name: Checkout SAM
        uses: actions/checkout@v4
        with:
          repository: SAM-BIM/SAM
          path: SAM
          fetch-depth: 0

      - name: Checkout SAM_gbXML
        uses: actions/checkout@v4
        with:
          repository: SAM-BIM/SAM_gbXML
          path: SAM_gbXML
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build SAM (Release)
        shell: pwsh
        working-directory: SAM
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          msbuild ".\SAM.sln" /t:Restore /m:1 /nr:false /v:m /p:Configuration=Release /p:UseSharedCompilation=false
          msbuild ".\SAM.sln" /t:Rebuild  /m:1 /nr:false /v:m /p:Configuration=Release /p:UseSharedCompilation=false
          if (-not (Test-Path ".\build")) { throw "SAM build folder not found: SAM\build" }

      - name: Build SAM_gbXML (Release)
        shell: pwsh
        working-directory: SAM_gbXML
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          $sln = Get-ChildItem -Path . -Filter *.sln -File | Select-Object -First 1
          if (-not $sln) { throw "No .sln found in SAM_gbXML repo root." }

          msbuild $sln.FullName /t:Restore /m:1 /nr:false /v:m /p:Configuration=Release /p:UseSharedCompilation=false
          msbuild $sln.FullName /t:Rebuild  /m:1 /nr:false /v:m /p:Configuration=Release /p:UseSharedCompilation=false
          if (-not (Test-Path ".\build")) { throw "SAM_gbXML build folder not found: SAM_gbXML\build" }

      - name: Build SAM_Tas (Release)
        shell: pwsh
        working-directory: SAM_Tas
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          $ErrorActionPreference = "Stop"
          msbuild ".\SAM_Tas.sln" /t:Restore /m:1 /nr:false /v:m /p:Configuration=Release /p:UseSharedCompilation=false
          msbuild ".\SAM_Tas.sln" /t:Rebuild  /m:1 /nr:false /v:m /p:Configuration=Release /p:UseSharedCompilation=false
