name: Build (Windows)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    # Guard so if this file ever gets merged upstream (HoareLea), it won't run there.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Prepare gitcache + clone dependencies
        shell: pwsh
        env:
          SAM_BIM_PAT: ${{ secrets.SUBMODULES_PAT }} # optional (only needed if any deps are private)
        run: |
          $ErrorActionPreference = 'Stop'

          $cache = Join-Path $env:GITHUB_WORKSPACE 'gitcache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null

          # Use authenticated URLs only if PAT is provided
          $org  = 'SAM-BIM'
          $base = "https://github.com/$org"
          if ($env:SAM_BIM_PAT) {
            $base = "https://x-access-token:$env:SAM_BIM_PAT@github.com/$org"
          }

          function Clone-Repo([string]$repo, [string]$dest, [string]$branch = 'master') {
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            $url = "$base/$repo.git"

            git clone --depth 1 --single-branch -b $branch $url $dest
            if ($LASTEXITCODE -ne 0) {
              Write-Host "WARN: clone $repo on '$branch' failed; trying 'main'..."
              git clone --depth 1 --single-branch -b 'main' $url $dest
              if ($LASTEXITCODE -ne 0) { throw "Failed to clone $repo (tried master + main)." }
            }
          }

          # Dependencies (order matters)
          Clone-Repo 'SAM'               (Join-Path $cache 'SAM')
          Clone-Repo 'SAM_gbXML'         (Join-Path $cache 'SAM_gbXML')
          Clone-Repo 'SAM_SolarCalculator' (Join-Path $cache 'SAM_SolarCalculator')
          Clone-Repo 'SAM_Windows'       (Join-Path $cache 'SAM_Windows')

          # Put *this* repo into gitcache too so sibling-relative references work the same way as the old Azure pipeline.
          $tasDest = Join-Path $cache 'SAM_Tas'
          if (Test-Path $tasDest) { Remove-Item $tasDest -Recurse -Force }
          git clone $env:GITHUB_WORKSPACE $tasDest | Out-Null
          Push-Location $tasDest
          git checkout $env:GITHUB_SHA | Out-Null
          Pop-Location

      - name: Restore + Rebuild (MSBuild)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          $ErrorActionPreference = 'Stop'

          function Build-Sln([string]$slnPath) {
            if (-not (Test-Path $slnPath)) { throw "Missing solution: $slnPath" }

            Write-Host "== Restore: $slnPath"
            msbuild $slnPath `
              /t:Restore `
              /m:1 /nr:false /v:m `
              /p:Configuration=Release `
              /p:UseSharedCompilation=false `
              /p:RestorePackagesConfig=true

            Write-Host "== Rebuild: $slnPath"
            msbuild $slnPath `
              /t:Rebuild `
              /m:1 /nr:false /v:m `
              /p:Configuration=Release `
              /p:UseSharedCompilation=false
          }

          Build-Sln ".\gitcache\SAM\SAM.sln"
          Build-Sln ".\gitcache\SAM_gbXML\SAM_gbXML.sln"
          Build-Sln ".\gitcache\SAM_SolarCalculator\SAM_SolarCalculator.sln"
          Build-Sln ".\gitcache\SAM_Windows\SAM_Windows.sln"
          Build-Sln ".\gitcache\SAM_Tas\SAM_Tas.sln"
